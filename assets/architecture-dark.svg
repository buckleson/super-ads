<text x="40" y="52" font-size="26" font-weight="800" fill="#f1f5f9">How Super Ads works</text>
<text x="40" y="78" font-size="14" fill="#64748b">One conductor, bounded workers, a deterministic core, and evidence for every claim.</text>
<rect x="40" y="104" width="1120" height="74" rx="14" fill="#111827" stroke="#1f2937"/>
