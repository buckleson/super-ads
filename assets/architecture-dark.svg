<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="816" viewBox="0 0 1200 816" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-labelledby="t d">
<title id="t">Super Ads architecture</title>
<desc id="d">An operator talks to the /ads conductor inside an agent host. The conductor routes to 33 skills and 25 bounded worker agents, which return schema-valid results to the deterministic super_ads_core engine. The control plane supplies sources, controls, capabilities and safety policy. Output is one validated JSON bundle rendered to Markdown, HTML or PDF. Account changes pass a mutation gate.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
