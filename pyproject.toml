[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-ads-core"
version = "2.0.0"
description = "Deterministic contracts, validation, and scoring for Super Ads"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["weasyprint>=70.0,<71.0"]

[project.scripts]
super-ads-core = "super_ads_core.cli:main"

[tool.setuptools.packages.find]
include = ["super_ads_core*"]

[tool.setuptools.package-data]
super_ads_core = ["schemas/v1/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
