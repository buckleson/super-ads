version: 2
updates:
  # Routine version-update pull requests are disabled for every ecosystem
  # (open-pull-requests-limit: 0), so Dependabot does not create update
  # branches. Python dependencies are hash-locked and pinned by the release
  # inventory, and GitHub Actions are pinned to full commit SHAs; both change
  # only in a reviewed release. Dependabot security updates are controlled
  # separately in the repository's security settings and are not affected.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
